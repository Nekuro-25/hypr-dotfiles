# =========================================================
# HYPRLOCK CONFIGURATION
# =========================================================
# Reuses the same wallpaper as hyprpaper for visual continuity.
# Palette: ice blue night (from the navy + periwinkle wallpaper).
# Semua warna memakai format hex (rgba RRGGBBAA) untuk konsistensi;
# nilai diambil dari config/theme.lua.
# =========================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    ignore_empty_input = true
}

# Animasi: lockscreen memudar masuk/keluar, titik password & warna
# input bertransisi halus.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldColors, 1, 4, easeOutQuint
    animation = inputFieldFade, 1, 4, easeOutQuint
    animation = inputFieldWidth, 1, 4, easeOutQuint
    animation = inputFieldDots, 1, 3, easeOutQuint
}

background {
    monitor =
    # Fallback warna latar (theme.bg) — mencegah flash hitam sebelum
    # wallpaper selesai dimuat, terutama pada cold-boot / GPU lambat.
    color = rgba(141d48ff)
    path = ~/.config/hypr/wallpapers/wallpaper.jpg
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# Clock (variabel bawaan $TIME — tidak perlu memanggil `date` tiap detik)
label {
    monitor =
    text = $TIME
    color = rgba(cfdefff2)                 # 207,222,255 @ 0.95
    font_size = 84
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(141d48ff)
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(dbe6ffbf)                 # 219,230,255 @ 0.75
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi, $USER
    color = rgba(a8c4ffd9)                 # 168,196,255 @ 0.85
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    rounding = 14
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(5d80e4ee) rgba(a8c4ffee) 45deg
    inner_color = rgba(141d4899)
    font_color = rgba(dbe6ffff)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(a8c4ffee) rgba(5d80e4ee) 45deg
    fail_color = rgba(f2829cff)
    capslock_color = rgba(e6c987ff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    hide_input = false
    shadow_passes = 2
    position = 0, -40
    halign = center
    valign = center
}
