# =========================================================
# HYPRIDLE CONFIGURATION
# =========================================================
# Idle behavior: dim -> lock -> display off -> suspend.
# Kunci manual: SUPER + SHIFT + ALT + L (keybinds/session.lua).
# Tahan semua auto-lock/suspend sementara: SUPER + F9 (caffeine).
#
# Hyprland 0.55+ (config Lua): `hyprctl dispatch` membaca
# ekspresi Lua, jadi sintaks lama "dispatch dpms off" error.
# Semua perintah dpms lewat scripts/dpms.sh.
# =========================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Saat bangun dari suspend: nyalakan DPMS *dan* kembalikan brightness
    # (listener 120s mungkin sudah menurunkan ke 10% sebelum suspend;
    # tanpa restore, layar menyala tapi redup sampai user beraktivitas).
    after_sleep_cmd = ~/.config/hypr/scripts/dpms.sh on; brightnessctl -r 2>/dev/null || true
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Redupkan layar + matikan lampu keyboard setelah 2 menit tanpa aktivitas.
# Pakai persen: panel ini bernilai maksimum 65535, jadi "set 10"
# (nilai mentah) hampir hitam. Perintah lampu keyboard diabaikan
# diam-diam bila perangkat tidak punya backlight.
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 10%; brightnessctl -sd '*kbd_backlight*' set 0 2>/dev/null; true
    on-resume = brightnessctl -r; brightnessctl -rd '*kbd_backlight*' 2>/dev/null; true
}

# Kunci setelah 5 menit
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Matikan layar setelah 5,5 menit (sesaat setelah terkunci)
listener {
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/dpms.sh off
    on-resume = ~/.config/hypr/scripts/dpms.sh on
}

# Suspend setelah 10 menit — hanya bila baterai sedang terpakai (Discharging).
# Dicolok (termasuk lewat USB-C) atau PC tanpa baterai: layar mati tapi
# komputer tetap menyala, mis. untuk download/build/SSH.
listener {
    timeout = 600
    on-timeout = grep -qs Discharging /sys/class/power_supply/BAT*/status && systemctl suspend
}

# Suspend paksa setelah 30 menit, di baterai maupun dicolok
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
